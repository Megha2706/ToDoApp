<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To Do App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Background Animation -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Main Container -->
    <div class="container">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                <span>✓</span>
                <h1>TaskFlow</h1>
            </div>

            <button id="themeBtn" class="theme-btn">
                🌙
            </button>

        </header>


        <!-- Welcome Section -->
        <section class="welcome">

            <div>
                <h2>Stay Organized ✨</h2>
                <p>Plan your tasks and get things done.</p>
            </div>

        </section>


        <!-- Progress Section -->
        <section class="progress-card">

            <div class="progress-info">

                <div>
                    <h3>Today's Progress</h3>
                    <p id="progressText">0 of 0 tasks completed</p>
                </div>

                <div class="progress-percent" id="progressPercent">
                    0%
                </div>

            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </section>


        <!-- Add Task -->
        <section class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
            >

            <select id="priorityInput">

                <option value="low">🟢 Low</option>
                <option value="medium">🟡 Medium</option>
                <option value="high">🔴 High</option>

            </select>

            <select id="categoryInput">

                <option value="College">📚 College</option>
                <option value="Coding">💻 Coding</option>
                <option value="Personal">🏠 Personal</option>
                <option value="Work">💼 Work</option>

            </select>

            <button id="addBtn">
                + Add Task
            </button>

        </section>


        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >

        </section>


        <!-- Filters -->
        <section class="filters">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="active">
                Active
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

        </section>


        <!-- Task List -->
        <section class="task-section">

            <div id="taskList">

                <!-- Tasks will appear here -->

            </div>

            <!-- Empty Message -->
            <div id="emptyMessage" class="empty-message">

                <div class="empty-icon">
                    📝
                </div>

                <h3>No Tasks Yet</h3>

                <p>
                    Add your first task and start being productive!
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Made with ❤️ for productivity
            </p>

        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
